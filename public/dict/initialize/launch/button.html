<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Event Launcher</title>

    <script src="/socket.io/socket.io.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        font-family: "Poppins", "Segoe UI", Arial, sans-serif;
        background-color: #ffffff;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #background {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: clamp(110px, 20dvh, 190px);
        background-color: #ffffff;
        pointer-events: none;
      }
      #countdownVideo {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        display: block;
        border: none;
        outline: none;
        -webkit-mask-image:
          linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%),
          linear-gradient(to bottom, transparent 0%, #000 8%, #000 90%, transparent 100%);
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%),
          linear-gradient(to bottom, transparent 0%, #000 8%, #000 90%, transparent 100%);
        mask-composite: intersect;
      }

      #tabletBadge {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        z-index: 20;
        padding: 0.45rem 1.15rem;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.86);
        color: #f8fafc;
        font-size: clamp(0.78rem, 1.5vmin, 1.05rem);
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        border: 1.5px solid rgba(56, 189, 248, 0.55);
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18);
        user-select: none;
      }

      #launchContainer {
        position: fixed;
        left: 50%;
        bottom: max(clamp(16px, 5dvh, 52px), env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 15;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(12px, 2.2dvh, 22px);
        width: min(380px, 84vw);
      }

      #playButton {
        position: relative;
        width: 100%;
        height: clamp(58px, 10dvh, 84px);
        padding: 0 clamp(18px, 3vw, 32px);
        font-family: inherit;
        font-size: clamp(1rem, 2.3vmin, 1.45rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        background: linear-gradient(
          90deg,
          rgba(58, 12, 184, 1) 0%,
          rgba(16, 16, 166, 1) 35%,
          rgba(25, 203, 240, 1) 100%
        );
        color: #fff;
        border: none;
        border-radius: 999px;
        transition: transform 0.18s ease, box-shadow 0.25s ease, filter 0.2s ease;
        box-shadow:
          0 10px 24px rgba(16, 16, 166, 0.32),
          inset 0 -6px 0 0 rgba(0, 0, 0, 0.22);
        overflow: hidden;
        animation: float 3s ease-in-out infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        white-space: nowrap;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      #playButton:hover {
        filter: brightness(1.06);
        box-shadow:
          0 14px 28px rgba(16, 16, 166, 0.38),
          inset 0 -6px 0 0 rgba(0, 0, 0, 0.26);
      }
      #playButton:active {
        transform: scale(0.97);
        box-shadow:
          0 6px 14px rgba(16, 16, 166, 0.28),
          inset 0 -3px 0 0 rgba(0, 0, 0, 0.22);
      }
      #playButton:disabled {
        animation: none;
        cursor: default;
        background: linear-gradient(90deg, #15803d 0%, #22c55e 100%);
        box-shadow: 0 8px 20px rgba(22, 163, 74, 0.35);
      }
      #playButton::before {
        content: "";
        position: absolute;
        inset: -50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.45) 0%,
          rgba(255, 255, 255, 0) 68%
        );
        transform: scale(0);
        transition: transform 0.55s ease;
        pointer-events: none;
      }
      #playButton:hover::before {
        transform: scale(1);
      }
      #playButton .material-icons {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      #playButton .material-icons svg {
        width: clamp(22px, 3.2vmin, 32px);
        height: clamp(22px, 3.2vmin, 32px);
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      #progressBar {
        width: 100%;
        height: clamp(16px, 2.4dvh, 24px);
        background-color: rgba(15, 23, 42, 0.12);
        border-radius: 999px;
        overflow: hidden;
        border: 2px solid rgba(15, 23, 42, 0.22);
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.12);
      }

      #progressFill {
        width: 0%;
        height: 100%;
        background: linear-gradient(
          90deg,
          rgba(58, 12, 184, 1) 0%,
          rgba(16, 16, 166, 1) 35%,
          rgba(25, 203, 240, 1) 100%
        );
        background-size: 200% 200%;
        transition: width 0.08s linear;
      }

      #launchMessage {
        position: fixed;
        left: 50%;
        bottom: max(clamp(20px, 6dvh, 56px), env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 15;
        padding: 0.7rem 1.6rem;
        border-radius: 999px;
        background: rgba(22, 163, 74, 0.12);
        border: 1.5px solid rgba(22, 163, 74, 0.45);
        font-size: clamp(0.95rem, 2.2vmin, 1.35rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #14532d;
        text-align: center;
        white-space: nowrap;
        display: none;
      }

      /* Landscape tablet / short-height adaptation */
      @media (orientation: landscape) {
        #background {
          padding-bottom: clamp(96px, 22dvh, 155px);
        }
        #launchContainer {
          bottom: max(clamp(12px, 3.6dvh, 30px), env(safe-area-inset-bottom));
          width: min(440px, 52vw);
          gap: clamp(8px, 1.8dvh, 14px);
        }
        #playButton {
          height: clamp(50px, 11.5dvh, 74px);
          font-size: clamp(0.95rem, 2.5dvh, 1.35rem);
        }
        #progressBar {
          height: clamp(14px, 2.6dvh, 20px);
        }
        #launchMessage {
          bottom: max(clamp(16px, 4.5dvh, 36px), env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div id="tabletBadge">Tablet ?</div>
    <div id="background">
      <video id="countdownVideo" autoplay loop muted playsinline>
        <source src="/videos/backdrop-ipad.mp4" type="video/mp4" />
      </video>
    </div>

    <div id="launchContainer">
      <button id="playButton" class="btn">
        <span class="material-icons">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#ffffff"
          >
            <path
              d="M360-840v-80h240v80H360Zm80 440h80v-240h-80v240Zm40 320q-74 0-139.5-28.5T226-186q-49-49-77.5-114.5T120-440q0-74 28.5-139.5T226-694q49-49 114.5-77.5T480-800q62 0 119 20t107 58l56-56 56 56-56 56q38 50 58 107t20 119q0 74-28.5 139.5T734-186q-49 49-114.5 77.5T480-80Zm0-80q116 0 198-82t82-198q0-116-82-198t-198-82q-116 0-198 82t-82 198q0 116 82 198t198 82Zm0-280Z"
            /></svg
        ></span>
        Start Countdown
      </button>
      <div id="progressBar">
        <div id="progressFill"></div>
      </div>
    </div>
    <div id="launchMessage">FREE WIFI already launched</div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const video = document.getElementById("countdownVideo");
        const launchButton = document.getElementById("playButton");
        const launchMessage = document.getElementById("launchMessage");
        const progressFill = document.getElementById("progressFill");
        const progressBar = document.getElementById("progressBar");

        // Tablet identity: ?tablet=1..5 (persisted so a bare URL keeps it).
        const tabletParam = new URLSearchParams(window.location.search).get("tablet");
        if (tabletParam) localStorage.setItem("tabletId", tabletParam);
        const tabletId = localStorage.getItem("tabletId") || null;
        const badge = document.getElementById("tabletBadge");
        if (badge) badge.textContent = tabletId ? `Tablet ${tabletId}` : "Tablet —";

        if (video) video.play();

        let pressTimer;
        let progress = 0;
        let progressInterval;
        let registered = false;
        const originalButtonHTML = launchButton ? launchButton.innerHTML : "";

        function resetButton() {
          registered = false;
          progress = 0;
          if (progressFill) progressFill.style.width = "0%";
          if (launchButton) {
            launchButton.disabled = false;
            launchButton.style.display = "flex";
            launchButton.innerHTML = originalButtonHTML;
          }
          if (launchMessage) launchMessage.style.display = "none";
          if (progressBar) progressBar.style.display = "block";
        }

        const socket = io();

        socket.on("reset", resetButton);

        // A tablet page opened after launch syncs straight to the "launched" state.
        socket.on("progress", (data) => {
          if (data && data.launched) {
            if (launchButton) launchButton.style.display = "none";
            if (progressBar) progressBar.style.display = "none";
            if (launchMessage) launchMessage.style.display = "block";
          }
        });

        socket.on("launch", () => {
          if (launchButton) launchButton.style.display = "none";
          if (progressBar) progressBar.style.display = "none";
          if (launchMessage) launchMessage.style.display = "block";
        });

        if (launchButton) {
          launchButton.addEventListener("mousedown", startPress);
          launchButton.addEventListener("mouseup", endPress);
          launchButton.addEventListener("mouseleave", endPress);
          launchButton.addEventListener("touchstart", startPress, { passive: false });
          launchButton.addEventListener("touchend", endPress);
          launchButton.addEventListener("touchcancel", endPress);
        }

        function startPress(e) {
          e.preventDefault();
          if (registered) return;
          progress = 0;
          progressFill.style.width = "0%";
          socket.emit("tabletHold", { tablet: tabletId ? Number(tabletId) : null, holding: true });

          progressInterval = setInterval(() => {
            progress += 1;
            progressFill.style.width = `${progress}%`;

            if (progress >= 100) {
              clearInterval(progressInterval);
              confirmPress();
            }
          }, 30); // Update every 30ms for a smooth 3-second fill

          pressTimer = setTimeout(() => {
            clearInterval(progressInterval);
            confirmPress();
          }, 3000);
        }

        function endPress() {
          if (registered) return;
          clearTimeout(pressTimer);
          clearInterval(progressInterval);
          progressFill.style.width = "0%";
          socket.emit("tabletHold", { tablet: tabletId ? Number(tabletId) : null, holding: false });
        }

        function confirmPress() {
          if (registered) return;
          registered = true;
          socket.emit("pressLaunch", { tablet: tabletId ? Number(tabletId) : null });
          if (progressFill) progressFill.style.width = "100%";
          if (launchButton) {
            launchButton.textContent = "Registered ✓";
            launchButton.disabled = true;
          }
        }
      });
    </script>
  </body>
</html>
