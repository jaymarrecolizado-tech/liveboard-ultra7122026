<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>(FPIAP) Free Public Internet Access Program — PICS PP Phase 2</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #background {
        width: 100vw;
        height: 100vh;
      }
      video {
        width: 100% !important;
        height: 100% !important;
        object-fit: fill !important;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #040914;
        font-family: Arial, sans-serif;
      }
      #videoContainer {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #040914;
        z-index: 2;
      }
      #countdownVideo,
      #distributionVideo,
      #seqVideo,
      #nfbMapFrame,
      #backdrop {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #nfbMapFrame {
        position: fixed;
        inset: 0;
        border: 0;
        background: #040914;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.65s ease;
        z-index: 5;
      }
      #nfbMapFrame.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      #countdownDisplay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 10vw;
        color: white;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }
      .full-width-image {
        width: 100%;
        height: auto;
        display: none;
      }

      #modal {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at 50% 40%, rgba(8, 25, 45, 0.35), rgba(0, 0, 0, 0.78));
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      #modal-content {
        position: relative;
        padding: clamp(2rem, 3vw, 3.5rem) clamp(2rem, 4vw, 4rem);
        border-radius: 22px;
        text-align: center;
        margin: 0 1.5rem;
        background: linear-gradient(160deg, rgba(13, 80, 143, 0.92), rgba(6, 44, 79, 0.94));
        border: 1px solid rgba(125, 211, 252, 0.35);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.05) inset,
          0 30px 80px rgba(0, 0, 0, 0.55),
          0 0 90px rgba(25, 203, 240, 0.18);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        overflow: hidden;
      }
      #modal-content::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, transparent, #19cbf0 20%, #97dee5 50%, #19cbf0 80%, transparent);
      }
      #modal-content::after {
        content: "";
        position: absolute;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        right: -160px;
        bottom: -200px;
        background: radial-gradient(circle, rgba(25, 203, 240, 0.22), transparent 65%);
        pointer-events: none;
      }

      #participateBtn {
        position: relative;
        z-index: 1;
        padding: 1.05rem 3.2rem;
        font-family: "Poppins", sans-serif;
        font-size: clamp(1.05rem, 1.6vw, 1.35rem);
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #eafffb;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        cursor: pointer;
        text-shadow: 0 0 14px rgba(25, 203, 240, 0.7);
        box-shadow:
          0 0 34px rgba(25, 203, 240, 0.35),
          inset 0 0 22px rgba(255, 255, 255, 0.08),
          inset 0 -8px 16px rgba(0, 0, 0, 0.25);
        background-image: linear-gradient(
          to right,
          #0d508f,
          #16569a,
          #1f5ca4,
          #2761af,
          #3067ba,
          #1a8ed8,
          #19cbf0
        );
        background-size: 200% 100%;
        animation: gradientFlow 4s ease infinite, float 2.4s ease-in-out infinite;
        transition: transform 0.2s ease;
      }
      #participateBtn:hover {
        transform: translateY(-4px) scale(1.03);
        box-shadow:
          0 0 55px rgba(25, 203, 240, 0.55),
          inset 0 0 26px rgba(255, 255, 255, 0.14);
      }

      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      .logo {
        position: relative;
        z-index: 1;
        display: flex;
        gap: clamp(1rem, 2vw, 1.8rem);
        justify-content: center;
        align-items: center;
        padding: 0.85rem 1.8rem;
        margin-bottom: 1.6rem;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 14px;
        box-shadow:
          0 6px 24px rgba(0, 0, 0, 0.35),
          inset 0 0 0 1px rgba(0, 0, 0, 0.06);
      }

      img {
        height: clamp(2.4rem, 3.8vw, 3.4rem);
        width: auto;
        max-width: none;
        object-fit: contain;
        filter: none;
      }
      h2 {
        position: relative;
        z-index: 1;
        font-family: "Bebas Neue", "Poppins", sans-serif;
        font-size: clamp(1.9rem, 3vw, 2.6rem);
        letter-spacing: 0.08em;
        line-height: 1.15;
        color: #f0fbff;
        font-weight: 400;
        margin-block: 1.1rem 2rem;
        text-shadow: 0 2px 26px rgba(0, 0, 0, 0.55);
      }
      h2 .sub {
        display: block;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: clamp(0.62rem, 1.1vw, 0.8rem);
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: #7dd3fc;
        margin-top: 0.85rem;
      }

      /* ---- Launch progress loading ---- */
      #loadingScreen {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        color: white;
        background:
          radial-gradient(1200px 700px at 50% -12%, rgba(56, 189, 248, 0.3), transparent 60%),
          radial-gradient(950px 650px at 50% 115%, rgba(14, 165, 233, 0.24), transparent 62%),
          linear-gradient(rgba(125, 211, 252, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(125, 211, 252, 0.05) 1px, transparent 1px),
          #071a2e;
        background-size: auto, auto, 46px 46px, 46px 46px, auto;
        z-index: 500;
      }
      #loadingScreen::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
        pointer-events: none;
      }
      .scanline {
        position: absolute;
        left: 0;
        right: 0;
        height: 120px;
        background: linear-gradient(to bottom, transparent, rgba(125, 211, 252, 0.12), transparent);
        animation: scan 5.5s linear infinite;
        pointer-events: none;
      }
      @keyframes scan {
        from { top: -20%; }
        to { top: 120%; }
      }
      .hud-corner {
        position: absolute;
        width: 38px;
        height: 38px;
        border: 2px solid rgba(125, 211, 252, 0.65);
        pointer-events: none;
      }
      .hud-corner.tl { top: 26px; left: 26px; border-right: none; border-bottom: none; }
      .hud-corner.tr { top: 26px; right: 26px; border-left: none; border-bottom: none; }
      .hud-corner.bl { bottom: 26px; left: 26px; border-right: none; border-top: none; }
      .hud-corner.br { bottom: 26px; right: 26px; border-left: none; border-top: none; }
      .hud-top-left,
      .hud-top-right {
        position: absolute;
        top: 34px;
        z-index: 2;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: clamp(0.6rem, 1vw, 0.75rem);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(224, 242, 254, 0.85);
      }
      .hud-top-left { left: 76px; }
      .hud-top-right {
        right: 76px;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        color: #fda4af;
      }
      .hud-top-right::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #f43f5e;
        animation: liveBlink 1.1s ease-in-out infinite;
        box-shadow: 0 0 10px rgba(244, 63, 94, 0.9);
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      #percentDisplay {
        position: relative;
        z-index: 1;
        font-family: "Bebas Neue", "Poppins", sans-serif;
        font-size: clamp(8rem, 19vw, 17rem);
        font-weight: 400;
        letter-spacing: 0.02em;
        line-height: 0.95;
        background: linear-gradient(180deg, #ffffff 15%, #b8ecff 45%, #38bdf8 80%, #0ea5e9 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 26px rgba(56, 189, 248, 0.45))
                drop-shadow(0 6px 60px rgba(56, 189, 248, 0.35));
      }
      #percentDisplay.bump {
        animation: bump 0.4s ease;
      }
      @keyframes bump {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }
      #loadingBar {
        position: relative;
        z-index: 1;
        width: min(58vw, 820px);
        height: 1.35rem;
        margin-top: 1.6rem;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(125, 211, 252, 0.5);
        box-shadow: 0 0 24px rgba(56, 189, 248, 0.18), inset 0 0 12px rgba(0, 0, 0, 0.5);
      }
      #loadingFill {
        position: relative;
        width: 0%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(90deg, #3a0cb8, #1010a6, #19cbf0, #97dee5);
        background-size: 250% 100%;
        animation: gradientFlow 2.8s ease infinite;
        border-radius: 999px;
        box-shadow: 0 0 18px rgba(56, 189, 248, 0.65);
      }
      #loadingFill::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 90px;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        animation: barShine 1.6s ease-in-out infinite;
      }
      @keyframes barShine {
        from { left: -110px; }
        to { left: 110%; }
      }
      @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      #loadingText {
        position: relative;
        z-index: 1;
        margin-top: 1.3rem;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: clamp(0.68rem, 1.35vw, 0.95rem);
        letter-spacing: 0.5em;
        text-transform: uppercase;
        text-indent: 0.5em;
        color: rgba(224, 242, 254, 0.9);
      }

      /* ---- Laptop connection map ---- */
      #connectionMap {
        position: relative;
        z-index: 1;
        width: min(92vw, 1150px);
        height: 26vh;
        min-height: 140px;
        margin-top: 1rem;
      }
      #connectionMap svg { width: 100%; height: 100%; }
      .link {
        stroke: rgba(255, 255, 255, 0.22);
        stroke-width: 3;
        stroke-linecap: round;
        transition: stroke 0.4s ease;
      }
      .link.active {
        stroke: #4ade80;
        stroke-width: 5;
        stroke-dasharray: 12 10;
        animation: dashFlow 0.7s linear infinite;
        filter: drop-shadow(0 0 6px rgba(74, 222, 128, 0.8));
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -22; }
      }
      .laptop-node .screen,
      .laptop-node .base {
        fill: rgba(255, 255, 255, 0.28);
        transition: fill 0.4s ease;
      }
      .laptop-node .label {
        fill: rgba(255, 255, 255, 0.55);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 2px;
        font-family: Arial, sans-serif;
        transition: fill 0.4s ease;
      }
      .laptop-node .dot {
        fill: rgba(255, 255, 255, 0.3);
        transition: fill 0.4s ease;
      }
      .laptop-node.active .screen,
      .laptop-node.active .base { fill: #22c55e; }
      .laptop-node.active .label { fill: #bbf7d0; }
      .laptop-node.active .dot {
        fill: #4ade80;
        animation: dotPulse 1.1s ease-in-out infinite;
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .hub {
        fill: rgba(255, 255, 255, 0.15);
        stroke: rgba(255, 255, 255, 0.4);
        stroke-width: 2;
        transition: all 0.4s ease;
      }
      .hub.all {
        fill: #22c55e;
        stroke: #bbf7d0;
        animation: hubPulse 1s ease-in-out infinite;
      }
      @keyframes hubPulse {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(74,222,128,0.7)); }
        50% { filter: drop-shadow(0 0 22px rgba(74,222,128,1)); }
      }
    </style>
  </head>
  <body>
    <div id="modal">
      <div id="modal-content">
        <div class="logo">
          <img src="assets/finale-dict.png" alt="DICT" />
          <img src="assets/finale-freewifi.png" alt="Free Wi-Fi for All" />
          <img src="assets/finale-bagong-pilipinas.png" alt="Bagong Pilipinas" />
          <img src="assets/finale-tuguegarao.png" alt="Tuguegarao City" />
        </div>
        <h2>
          Free Public Internet Access Program
          <span class="sub">PICS PP Phase 2 · Tuguegarao City · DICT Region 2</span>
        </h2>
        <button id="participateBtn">Participate</button>
      </div>
    </div>

    <div id="loadingScreen">
      <div class="scanline"></div>
      <div class="hud-corner tl"></div>
      <div class="hud-corner tr"></div>
      <div class="hud-corner bl"></div>
      <div class="hud-corner br"></div>
      <div class="hud-top-left">FPIAP · PICS PP Phase 2</div>
      <div class="hud-top-right">Live</div>
      <div id="percentDisplay">0%</div>
      <div id="loadingBar">
        <div id="loadingFill"></div>
      </div>
      <svg id="connectionMap" viewBox="0 0 1000 250" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Laptop connection map">
        <line id="link-1" class="link" x1="100" y1="112" x2="500" y2="228" />
        <line id="link-2" class="link" x1="300" y1="112" x2="500" y2="228" />
        <line id="link-3" class="link" x1="500" y1="112" x2="500" y2="228" />
        <line id="link-4" class="link" x1="700" y1="112" x2="500" y2="228" />
        <line id="link-5" class="link" x1="900" y1="112" x2="500" y2="228" />
        <circle id="hub" class="hub" cx="500" cy="230" r="13" />
        <g id="laptop-1" class="laptop-node"><rect class="screen" x="70" y="28" width="60" height="38" rx="5"/><rect class="base" x="58" y="70" width="84" height="7" rx="3.5"/><text class="label" x="100" y="98" text-anchor="middle">LAPTOP 1</text><circle class="dot" cx="100" cy="106" r="4"/></g>
        <g id="laptop-2" class="laptop-node"><rect class="screen" x="270" y="28" width="60" height="38" rx="5"/><rect class="base" x="258" y="70" width="84" height="7" rx="3.5"/><text class="label" x="300" y="98" text-anchor="middle">LAPTOP 2</text><circle class="dot" cx="300" cy="106" r="4"/></g>
        <g id="laptop-3" class="laptop-node"><rect class="screen" x="470" y="28" width="60" height="38" rx="5"/><rect class="base" x="458" y="70" width="84" height="7" rx="3.5"/><text class="label" x="500" y="98" text-anchor="middle">LAPTOP 3</text><circle class="dot" cx="500" cy="106" r="4"/></g>
        <g id="laptop-4" class="laptop-node"><rect class="screen" x="670" y="28" width="60" height="38" rx="5"/><rect class="base" x="658" y="70" width="84" height="7" rx="3.5"/><text class="label" x="700" y="98" text-anchor="middle">LAPTOP 4</text><circle class="dot" cx="700" cy="106" r="4"/></g>
        <g id="laptop-5" class="laptop-node"><rect class="screen" x="870" y="28" width="60" height="38" rx="5"/><rect class="base" x="858" y="70" width="84" height="7" rx="3.5"/><text class="label" x="900" y="98" text-anchor="middle">LAPTOP 5</text><circle class="dot" cx="900" cy="106" r="4"/></g>
      </svg>
      <div id="loadingText">Preparing launch</div>
    </div>

    <div style="position: relative">
      <div id="background">
        <video
          id="backdropVideo"
          autoplay
          loop
          muted
          playsinline
          preload="auto"
        >
          <source src="videos/backdrop-fw.mp4" type="video/mp4" />
        </video>
      </div>
      <div id="videoContainer">
        <video id="countdownVideo" playsinline preload="none">
          <source src="videos/countdown-new.mp4" type="video/mp4" />
        </video>
        <video id="distributionVideo" playsinline preload="auto" style="display: none">
          <source src="videos/nfb-distribution.mp4" type="video/mp4" />
        </video>
        <video id="loopingVideo" loop playsinline preload="auto" style="display: none">
          <source src="videos/last-loop.mp4" type="video/mp4" />
        </video>
        <video id="seqVideo" playsinline preload="auto" style="display: none"></video>
      </div>
    </div>

    <!-- Preloaded local cinematic PICS PP Phase 2 zoom map (tiles cached before countdown ends) -->
    <iframe id="nfbMapFrame" src="/nfb-map.html?stage=1" allow="autoplay" title="PICS PP Phase 2 Cinematic Map"></iframe>

    <script>
      const socket = io();

      socket.on("connect", () => {
        console.log("Connected to server");
      });

      const backdropVideo = document.getElementById("backdropVideo");
      const videoContainer = document.getElementById("videoContainer");
      const countdownVideo = document.getElementById("countdownVideo");
      const distributionVideo = document.getElementById("distributionVideo");
      const loopingVideo = document.getElementById("loopingVideo");
      const seqVideo = document.getElementById("seqVideo");
      const nfbMapFrame = document.getElementById("nfbMapFrame");
      const modal = document.getElementById("modal");
      const participateBtn = document.getElementById("participateBtn");
      const loadingScreen = document.getElementById("loadingScreen");
      const percentDisplay = document.getElementById("percentDisplay");
      const loadingFill = document.getElementById("loadingFill");
      const loadingText = document.getElementById("loadingText");
      const hub = document.getElementById("hub");
      let launchTimer = null;
      const TOTAL_LAPTOPS = 5;
      const isPreview = new URLSearchParams(window.location.search).get("preview") === "1";

      if (isPreview) {
        countdownVideo.muted = true;
        distributionVideo.muted = true;
        loopingVideo.muted = true;
        seqVideo.muted = true;
        nfbMapFrame.src = "/nfb-map.html?stage=1&muted=1";
      }

      let latestMapState = null;
      function postToMap(msg) {
        if (nfbMapFrame && nfbMapFrame.contentWindow) {
          nfbMapFrame.contentWindow.postMessage(msg, "*");
        }
      }
      function syncMapStateToFrame(st) {
        if (!st) return;
        postToMap({ type: "set-sound", enabled: isPreview ? false : Boolean(st.soundEnabled) });
        postToMap({ type: "set-clean", enabled: Boolean(st.cleanMode) });
        if (st.voiceoverUrl) {
          postToMap({ type: "set-voiceover", url: st.voiceoverUrl, name: st.voiceoverName });
        }
      }
      nfbMapFrame.addEventListener("load", function () {
        syncMapStateToFrame(latestMapState);
      });

      let distributionAvailable = true;
      distributionVideo.addEventListener("error", function () {
        distributionAvailable = false;
      });
      const distSource = distributionVideo.querySelector("source");
      if (distSource) {
        distSource.addEventListener("error", function () {
          distributionAvailable = false;
        });
      }

      function renderConnections(pressedTablets) {
        const pressed = new Set((pressedTablets || []).map(Number));
        for (let i = 1; i <= TOTAL_LAPTOPS; i++) {
          const active = pressed.has(i);
          const node = document.getElementById("laptop-" + i);
          const link = document.getElementById("link-" + i);
          if (node) node.classList.toggle("active", active);
          if (link) link.classList.toggle("active", active);
        }
        if (hub) hub.classList.toggle("all", pressed.size >= TOTAL_LAPTOPS);
      }

      let hasParticipated = isPreview;
      let launched = false;
      let currentPercent = 0;
      let targetPercent = 0;
      let animating = false;

      function setDisplayMode(mode) {
        backdropVideo.style.display = mode === "background" ? "block" : "none";
        videoContainer.style.display = mode === "video" ? "block" : "none";
        loadingScreen.style.display = mode === "loading" ? "flex" : "none";
      }

      if (isPreview) {
        modal.style.display = "none";
        setDisplayMode("loading");
      }

      function startLoopingVideo() {
        countdownVideo.style.display = "none";
        distributionVideo.style.display = "none";
        nfbMapFrame.classList.remove("active");
        loopingVideo.style.display = "block";
        loopingVideo.currentTime = 0;
        loopingVideo.play().catch(function (e) {
          console.error("Error playing looping video:", e);
        });
      }

      function startLocalCinematicMap() {
        countdownVideo.style.display = "none";
        distributionVideo.style.display = "none";
        loopingVideo.style.display = "none";
        nfbMapFrame.classList.add("active");
        if (nfbMapFrame.contentWindow) {
          nfbMapFrame.contentWindow.postMessage({ type: "start-nfb-cinematic" }, "*");
        }
      }

      let sequenceSteps = [
        { kind: "map", file: "", loop: false },
        { kind: "video", file: "last-loop.mp4", loop: true },
      ];
      let activeStepIndex = -1;
      let currentSeqSrc = "";

      function stopAllVideos() {
        [countdownVideo, distributionVideo, loopingVideo, seqVideo].forEach(function (v) {
          v.pause();
          try { v.currentTime = 0; } catch {}
          v.style.display = "none";
        });
      }

      function applyVideoMuteState(enabled) {
        const en = isPreview ? false : Boolean(enabled);
        countdownVideo.muted = !en;
        distributionVideo.muted = !en;
        loopingVideo.muted = !en;
        seqVideo.muted = !en;
      }

      function launchCinematicMap() {
        clearTimeout(launchTimer);
        modal.style.display = "none";
        stopAllVideos();
        setDisplayMode("video");
        nfbMapFrame.classList.add("active");
        syncMapStateToFrame(latestMapState);
        postToMap({ type: "replay-nfb-cinematic" });
      }

      function playSequenceStep(idx) {
        if (!Array.isArray(sequenceSteps) || idx < 0 || idx >= sequenceSteps.length) return;
        const step = sequenceSteps[idx];
        activeStepIndex = idx;
        if (!isPreview) socket.emit("sequence-status", { activeIndex: idx });

        clearTimeout(launchTimer);
        modal.style.display = "none";
        stopAllVideos();
        setDisplayMode("video");

        if (step.kind === "map") {
          nfbMapFrame.classList.add("active");
          syncMapStateToFrame(latestMapState);
          postToMap({ type: "replay-nfb-cinematic" });
          return;
        }

        // Video step
        nfbMapFrame.classList.remove("active");
        postToMap({ type: "reset-nfb-cinematic" });
        const targetSrc = "videos/" + encodeURIComponent(step.file);
        if (currentSeqSrc !== targetSrc) {
          currentSeqSrc = targetSrc;
          seqVideo.src = targetSrc;
          seqVideo.load();
        }
        seqVideo.loop = Boolean(step.loop);
        applyVideoMuteState(latestMapState ? latestMapState.soundEnabled : true);
        seqVideo.style.display = "block";
        try { seqVideo.currentTime = 0; } catch {}
        seqVideo.play().catch(function (e) {
          if (e && e.name !== "AbortError") console.error("Error playing sequence video:", step.file, e);
        });
      }

      function advanceSequence() {
        if (activeStepIndex < 0 || activeStepIndex >= sequenceSteps.length) return;
        const cur = sequenceSteps[activeStepIndex];
        if (cur && cur.loop) {
          playSequenceStep(activeStepIndex);
          return;
        }
        if (activeStepIndex + 1 < sequenceSteps.length) {
          playSequenceStep(activeStepIndex + 1);
        }
      }

      seqVideo.addEventListener("ended", function () {
        advanceSequence();
      });

      window.addEventListener("message", function (ev) {
        if (!ev.data || typeof ev.data !== "object") return;
        if (ev.data.type === "nfb-cinematic-started") {
          if (!isPreview) socket.emit("map-status", { playing: true });
        } else if (ev.data.type === "nfb-cinematic-ended") {
          if (!isPreview) socket.emit("map-status", { playing: false });
          if (activeStepIndex >= 0 && sequenceSteps[activeStepIndex] && sequenceSteps[activeStepIndex].kind === "map") {
            advanceSequence();
          } else {
            startLoopingVideo();
          }
        }
      });

      socket.on("map-state", function (st) {
        latestMapState = st;
        applyVideoMuteState(st && st.soundEnabled);
        syncMapStateToFrame(st);
      });

      socket.on("sequence-state", function (st) {
        if (st && Array.isArray(st.steps) && st.steps.length) {
          sequenceSteps = st.steps;
        }
        if (isPreview && st && Number.isInteger(st.activeIndex) && st.activeIndex >= 0 && st.activeIndex !== activeStepIndex) {
          playSequenceStep(st.activeIndex);
        }
      });

      socket.on("sequence-command", function (cmd) {
        if (!cmd || typeof cmd !== "object") return;
        if (cmd.type === "play-step") {
          playSequenceStep(Number(cmd.index));
        }
      });

      socket.on("map-command", function (cmd) {
        if (!cmd || typeof cmd !== "object") return;
        if (cmd.type === "play-cinematic") {
          const mapIdx = sequenceSteps.findIndex(function (s) { return s.kind === "map"; });
          if (mapIdx >= 0) {
            playSequenceStep(mapIdx);
          } else {
            activeStepIndex = -1;
            launchCinematicMap();
          }
        } else if (cmd.type === "set-sound") {
          applyVideoMuteState(cmd.enabled);
          postToMap({ type: "set-sound", enabled: isPreview ? false : Boolean(cmd.enabled) });
        } else if (cmd.type === "set-clean") {
          postToMap({ type: "set-clean", enabled: Boolean(cmd.enabled) });
        } else if (cmd.type === "set-voiceover") {
          postToMap({ type: "set-voiceover", url: cmd.url, name: cmd.name });
        }
      });

      countdownVideo.addEventListener("ended", function () {
        countdownVideo.style.display = "none";
        if (!distributionAvailable || distributionVideo.networkState === HTMLMediaElement.NETWORK_NO_SOURCE) {
          startLocalCinematicMap();
          return;
        }
        distributionVideo.style.display = "block";
        distributionVideo.currentTime = 0;
        distributionVideo.play().catch(function () {
          startLocalCinematicMap();
        });
      });

      distributionVideo.addEventListener("ended", function () {
        startLoopingVideo();
      });

      function startAVP() {
        playSequenceStep(0);
      }

      // "Participate" doubles as the user gesture that unlocks autoplay.
      // If the event already launched, clicking Participate jumps straight into the AVP.
      participateBtn.addEventListener("click", function () {
        modal.style.display = "none";
        hasParticipated = true;
        if (launched) {
          startAVP();
          return;
        }
        currentPercent = 0;
        percentDisplay.textContent = "0%";
        loadingFill.style.width = "0%";
        setDisplayMode("loading");
        if (targetPercent > 0) animatePercent();
      });

      // Each tablet press pushes the shared progress up by 20%.
      socket.on("progress", function (data) {
        targetPercent = data.percent;
        if (data.launched) launched = true;
        renderConnections(data.pressedTablets);
        if (hasParticipated) animatePercent();
      });

      // 5th press completes 100% -> let 100% animation settle, then launch configured sequence step 1
      socket.on("launch", function () {
        launched = true;
        if (!hasParticipated) return;
        clearTimeout(launchTimer);
        currentPercent = 100;
        targetPercent = 100;
        animating = false;
        percentDisplay.textContent = "100%";
        loadingFill.style.width = "100%";
        if (loadingText) loadingText.textContent = "Launching PICS PP Phase 2…";
        launchTimer = setTimeout(function () {
          if (launched) startAVP();
        }, 1150);
      });

      // Reset from the dashboard: back to the Participate modal at 0% (preview stays ready at 0% loading screen).
      socket.on("reset", function () {
        clearTimeout(launchTimer);
        activeStepIndex = -1;
        hasParticipated = isPreview;
        launched = false;
        currentPercent = 0;
        targetPercent = 0;
        animating = false;
        percentDisplay.textContent = "0%";
        loadingFill.style.width = "0%";
        if (loadingText) loadingText.textContent = "Preparing launch";

        stopAllVideos();
        nfbMapFrame.classList.remove("active");
        postToMap({ type: "reset-nfb-cinematic" });

        renderConnections([]);
        if (isPreview) {
          modal.style.display = "none";
          setDisplayMode("loading");
        } else {
          setDisplayMode("background");
          modal.style.display = "flex";
        }
      });

      // Animate the big % number + bar toward targetPercent (ease-out cubic).
      function animatePercent() {
        if (animating) return;
        animating = true;

        const start = currentPercent;
        const startTime = performance.now();
        const duration = 1000;

        percentDisplay.classList.remove("bump");
        void percentDisplay.offsetWidth; // restart the bump animation
        percentDisplay.classList.add("bump");

        function step(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - t, 3);
          currentPercent = Math.round(start + (targetPercent - start) * eased);
          percentDisplay.textContent = currentPercent + "%";
          loadingFill.style.width = currentPercent + "%";

          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            currentPercent = targetPercent;
            animating = false;
          }
        }

        requestAnimationFrame(step);
      }
    </script>
  </body>
</html>
